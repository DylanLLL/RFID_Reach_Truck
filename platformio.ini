[env:cabin_unit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    https://github.com/ricmoo/QRCode.git

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; TFT_eSPI compiles as its own library, so a header sitting in src/ is
    ; invisible to it. USER_SETUP_LOADED stops it pulling in its bundled
    ; User_Setup.h (which targets a plain ESP32 on different pins), and
    ; -include force-feeds our config into every translation unit including
    ; the library's. Without both, the panel stays blank and it looks like a
    ; wiring fault.
    -DUSER_SETUP_LOADED=1
    -include "${PROJECT_DIR}/src/cabin_unit/config.h"

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

build_src_filter = +<cabin_unit>

[env:fork_unit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; No TFT_eSPI or QRCode here -- the fork unit is a sensor with no display, and
; the display libraries were only inherited by copying the cabin_unit env. That
; also meant USER_SETUP_LOADED suppressed TFT_eSPI's bundled setup while the
; -include pointed at an empty config.h, so every TFT_* symbol was undefined.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

build_src_filter = +<fork_unit>

