[env:R200]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSER_SETUP_LOADED=1
    ; Without DEBUG the R200 library prints NOTHING on a successful tag read --
    ; every Serial.print in the single-poll path is inside #ifdef DEBUG. The
    ; reader looks dead when it is actually working. Keep this on for bring-up.
    -DDEBUG

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

build_src_filter = +<R200.cpp>